{# Componente compartido para agregar y editar productos #}
<div class="form-layout" id="form-layout-container" data-stock-bajo="{{ stock_bajo|default(5) }}">
    <div class="form-container">
        <form method="POST" novalidate>
            <div class="form-section-title">Información General</div>

            <div class="form-group">
                <label class="form-label" for="nombre">Nombre del producto <span class="req">*</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" maxlength="150"
                       value="{{ producto.nombre or '' }}" placeholder="Ej: Teclado Mecánico RGB" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="categoria_id">Categoría</label>
                <select class="form-control" id="categoria_id" name="categoria_id">
                    <option value="">-- Sin categoría --</option>
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if producto.categoria_id == cat.id %}selected{% endif %}>
                        {{ cat.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="descripcion">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion"
                          placeholder="Especificaciones del producto...">{{ producto.descripcion or '' }}</textarea>
            </div>

            <div class="form-section-title">Precio y Stock</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="precio">Precio unitario ($) <span class="req">*</span></label>
                    <div class="input-affix">
                        <span class="affix">$</span>
                        <input class="form-control" type="number" step="0.01" min="0" id="precio" name="precio"
                               value="{{ producto.precio or '' }}" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="cantidad">Cantidad en stock <span class="req">*</span></label>
                    <div class="input-affix">
                        <span class="affix"><i data-lucide="boxes"></i></span>
                        <input class="form-control" type="number" step="1" min="0" id="cantidad" name="cantidad"
                               value="{{ producto.cantidad if producto.cantidad is not none else '' }}" placeholder="0" required>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="{{ icono_submit }}"></i> {{ texto_submit }}
                </button>
            </div>
        </form>
    </div>

    <!-- Panel Lateral con Vista Previa Dinámica -->
    <aside class="preview-card" aria-label="Vista previa">
        <div class="preview-title">Vista previa del producto</div>
        <div class="product-cell">
            <div class="product-avatar" id="pv-avatar">?</div>
            <div class="product-text">
                <span class="product-name" id="pv-nombre">Nombre del producto</span>
                <span class="product-desc" id="pv-desc">Sin descripción</span>
            </div>
        </div>
        <dl class="preview-list">
            <div>
                <dt>Precio</dt>
                <dd id="pv-precio">$0.00</dd>
            </div>
            <div>
                <dt>Stock</dt>
                <dd id="pv-estado"></dd>
            </div>
            <div class="preview-total">
                <dt>Valor en stock</dt>
                <dd id="pv-valor">$0.00</dd>
            </div>
        </dl>
    </aside>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var container = document.getElementById('form-layout-container');
        var STOCK_BAJO = container ? parseInt(container.getAttribute('data-stock-bajo'), 10) || 5 : 5;
        
        function $(id) { 
            return document.getElementById(id); 
        }

        function fmt(n) {
            return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function actualizar() {
            var nombreEl = $('nombre');
            var descEl = $('descripcion');
            var precioEl = $('precio');
            var cantEl = $('cantidad');

            var nombre = nombreEl ? nombreEl.value.trim() : '';
            var desc = descEl ? descEl.value.trim() : '';
            var precio = precioEl ? (parseFloat(precioEl.value) || 0) : 0;
            var cant = cantEl ? (parseInt(cantEl.value, 10) || 0) : 0;

            $('pv-avatar').textContent = nombre ? nombre[0].toUpperCase() : '?';
            $('pv-nombre').textContent = nombre || 'Nombre del producto';
            $('pv-desc').textContent = desc || 'Sin descripción';
            $('pv-precio').textContent = fmt(precio);
            $('pv-valor').textContent = fmt(precio * cant);

            var estado = $('pv-estado');
            if (cant === 0) {
                estado.innerHTML = '<span class="badge badge-danger">Agotado</span>';
            } else if (cant < STOCK_BAJO) {
                estado.innerHTML = '<span class="badge badge-warning">' + cant + ' · Stock bajo</span>';
            } else {
                estado.innerHTML = '<span class="badge badge-success">' + cant + ' unidades</span>';
            }
        }

        var campos = ['nombre', 'descripcion', 'precio', 'cantidad'];
        for (var i = 0; i < campos.length; i++) {
            var el = $(campos[i]);
            if (el) {
                el.addEventListener('input', actualizar);
            }
        }

        actualizar();
    });
</script>
