{# Formulario compartido por agregar.html y editar.html #}
<div class="form-layout">
    <div class="form-container">
        <form method="post" novalidate>
            <div class="form-section-title">Información general</div>

            <div class="form-group">
                <label class="form-label" for="nombre">Nombre del producto <span class="req">*</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" maxlength="150"
                       value="{{ producto.nombre }}" placeholder="Ej: Teclado Mecánico RGB" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="descripcion">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion"
                          placeholder="Breve descripción de las especificaciones del producto...">{{ producto.descripcion or '' }}</textarea>
            </div>

            <div class="form-section-title">Precio y existencias</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="precio">Precio unitario <span class="req">*</span></label>
                    <div class="input-affix">
                        <span class="affix">$</span>
                        <input class="form-control" type="number" step="0.01" min="0" id="precio" name="precio"
                               value="{{ producto.precio }}" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="cantidad">Cantidad en stock <span class="req">*</span></label>
                    <div class="input-affix">
                        <span class="affix"><i data-lucide="boxes"></i></span>
                        <input class="form-control" type="number" step="1" min="0" id="cantidad" name="cantidad"
                               value="{{ producto.cantidad }}" placeholder="0" required>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="{{ icono_submit }}"></i> {{ texto_submit }}
                </button>
            </div>
        </form>
    </div>

    {# Panel lateral con vista previa en vivo #}
    <aside class="preview-card" aria-label="Vista previa">
        <div class="preview-title">Vista previa</div>
        <div class="product-cell">
            <div class="product-avatar" id="pv-avatar">?</div>
            <div class="product-text">
                <span class="product-name" id="pv-nombre">Nombre del producto</span>
                <span class="product-desc" id="pv-desc">Sin descripción</span>
            </div>
        </div>
        <dl class="preview-list">
            <div><dt>Precio</dt><dd id="pv-precio">$0.00</dd></div>
            <div><dt>Stock</dt><dd id="pv-estado"></dd></div>
            <div class="preview-total"><dt>Valor en stock</dt><dd id="pv-valor">$0.00</dd></div>
        </dl>
    </aside>
</div>

<script>
    (function () {
        var STOCK_BAJO = {{ stock_bajo }};
        var $ = function (id) { return document.getElementById(id); };
        var fmt = function (n) {
            return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        function actualizar() {
            var nombre = $('nombre').value.trim();
            var desc = $('descripcion').value.trim();
            var precio = parseFloat($('precio').value) || 0;
            var cant = parseInt($('cantidad').value, 10) || 0;

            $('pv-avatar').textContent = nombre ? nombre[0].toUpperCase() : '?';
            $('pv-nombre').textContent = nombre || 'Nombre del producto';
            $('pv-desc').textContent = desc || 'Sin descripción';
            $('pv-precio').textContent = fmt(precio);
            $('pv-valor').textContent = fmt(precio * cant);

            var estado = $('pv-estado');
            if (cant === 0) {
                estado.innerHTML = '<span class="badge badge-danger">Agotado</span>';
            } else if (cant < STOCK_BAJO) {
                estado.innerHTML = '<span class="badge badge-warning">' + cant + ' · Bajo</span>';
            } else {
                estado.innerHTML = '<span class="badge badge-success">' + cant + '</span>';
            }
        }

        ['nombre', 'descripcion', 'precio', 'cantidad'].forEach(function (id) {
            $(id).addEventListener('input', actualizar);
        });
        actualizar();
    })();
</script>
